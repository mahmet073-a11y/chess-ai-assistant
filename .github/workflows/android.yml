
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      
      
      - name: Download and package Stockfish 19
        run: |
          curl -fL --retry 3 \
            https://github.com/official-stockfish/Stockfish/releases/download/sf_19/stockfish-android-arm64-universal.tar.gz \
            -o /tmp/stockfish.tar.gz

          mkdir -p app/src/main/jniLibs/arm64-v8a

          tar -xzf /tmp/stockfish.tar.gz \
            -C /tmp \
            stockfish/stockfish-android-arm64-universal

          cp /tmp/stockfish/stockfish-android-arm64-universal \
            app/src/main/jniLibs/arm64-v8a/libstockfish.so

          chmod 755 app/src/main/jniLibs/arm64-v8a/libstockfish.so

          file app/src/main/jniLibs/arm64-v8a/libstockfish.so

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chess-ai-assistant-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          
